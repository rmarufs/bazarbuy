{#- Inline SVG icons (24x24, stroke only). Usage: {{ icon("plus") }} -#}
{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "plus" %}<path d="M12 5v14M5 12h14"/>
  {%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
  {%- elif name == "trash" %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
  {%- elif name == "box" %}<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9zM3 7.5l9 4.5 9-4.5M12 12v9"/>
  {%- elif name == "tag" %}<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9zM8 8h.01"/>
  {%- elif name == "settings" %}<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
  {%- elif name == "logout" %}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/>
  {%- elif name == "user" %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {%- elif name == "lock" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {%- elif name == "phone" %}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>
  {%- elif name == "login" %}<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M14 8l4 4-4 4M18 12H8"/>
  {%- elif name == "edit" %}<path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4zM14 6l4 4"/>
  {%- elif name == "image" %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 9"/>
  {%- elif name == "arrow-left" %}<path d="M19 12H5M11 6l-6 6 6 6"/>
  {%- elif name == "grip" %}<path d="M5 8h14M5 12h14M5 16h14"/>
  {%- elif name == "cart" %}<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11h10.6L20.5 8H6.2"/>
  {%- elif name == "search" %}<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>
  {%- elif name == "x" %}<path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "grid" %}<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>
  {%- elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {%- elif name == "message" %}<path d="M4 5h16v11H9l-5 4V5z"/>
  {%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- endif %}
</svg>
{%- endmacro %}
