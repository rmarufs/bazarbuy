{% extends "admin/base.html" %}
{% from "admin/_icons.html" import icon %}
{% block title %}Вход{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card card-narrow">
  <p class="brand brand-lg">Bazarbuy.tj</p>
  <h1>Вход в админку</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="form">
    <label for="username">Логин</label>
    <div class="input-icon">
      {{ icon("user", 18) }}
      <input id="username" name="username" type="text" value="{{ username or '' }}"
             autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <label for="password">Пароль</label>
    <div class="input-icon">
      {{ icon("lock", 18) }}
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">
      {{ icon("login", 18) }}<span>Войти</span>
    </button>
  </form>
</section>
{% endblock %}
